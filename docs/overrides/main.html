{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <link rel="stylesheet" href="https://assets.asopi.tech/consent/v1/consent.css">
  <script
    data-asopi-consent
    data-measurement-id="G-84QN39HSQX"
    data-consent-version="1"
    data-policy-url="https://asopi.tech/privacy"
    data-policy-url-en="https://asopi.tech/en/privacy/"
    data-linker-domains="asopi.tech,project-jvlang.github.io,alopex-db.github.io,asopitech.github.io,asopitech-labs.github.io,buymeacoffee.com"
    src="https://assets.asopi.tech/consent/v1/consent.js"
    defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var link = document.getElementById('asopi-consent-settings');
      if (link) link.addEventListener('click', function (event) {
        event.preventDefault();
        if (window.AsopiConsentBanner) window.AsopiConsentBanner.showSettings();
      });

      document.querySelectorAll(
        'a[href*="github.com/sponsors/asopitech"][href*="metadata_content=docs_nav_sponsor"]'
      ).forEach(function (sponsorNavLink) {
        sponsorNavLink.dataset.gtm = 'docs_sponsor_nav_click';
      });

      document.addEventListener('click', function (event) {
        var cta = event.target.closest('[data-analytics-event], [data-gtm]');
        if (!cta || typeof window.gtag !== 'function') return;

        var eventParameters = {
            link_url: cta.href,
            link_text: cta.textContent.trim()
        };
        var eventName = cta.dataset.gtm || cta.dataset.analyticsEvent;
        window.gtag('event', eventName, eventParameters);

        if (cta.dataset.gtm) {
          window.gtag('event', 'github_sponsor_click', eventParameters);
        }
      });
    });
  </script>
{% endblock %}

{% block announce %}
  <strong>Pre-Alpha:</strong> Alopex DB is in early development.
  <a href="https://github.com/alopex-db/alopex">Star on GitHub</a> to follow progress!
{% endblock %}
